name: CRM cron authentication security (static)

# Fail closed when a cron route, middleware, or browser credential boundary
# changes. This does not replace live authentication/SSE/cron acceptance tests.
on:
  pull_request:
  push:
    branches:
      - main
      - ai/dgr-stage2b-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-cron-auth-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check cron allowlist, route auth, browser token and SSE hold
        run: node --test scripts/security-cron-boundary.test.mjs
      - name: Test Basic-auth dashboard mutation CSRF origin policy
        run: node --experimental-strip-types --test scripts/security-dashboard-origin.test.mjs
