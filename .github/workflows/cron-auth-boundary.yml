name: CRM cron authentication security (static)

# Fail closed when a cron route, middleware, or browser credential boundary
# changes. This does not replace live authentication/SSE/cron acceptance tests.
on:
  pull_request:
  push:
    branches:
      - main
      - ai/dgr-stage2b-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-cron-auth-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cron allowlist, route auth, browser token and SSE hold
        run: node --test scripts/security-cron-boundary.test.mjs
