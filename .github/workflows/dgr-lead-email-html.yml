name: DGR lead notification HTML safety

on:
  pull_request:
    paths:
      - 'app/api/leads/route.ts'
      - 'scripts/test-lead-email-escape.mjs'
      - '.github/workflows/dgr-lead-email-html.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/leads/route.ts'
      - 'scripts/test-lead-email-escape.mjs'
      - '.github/workflows/dgr-lead-email-html.yml'

permissions:
  contents: read

jobs:
  source-escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify source HTML escaping
        run: node scripts/test-lead-email-escape.mjs
