name: E-EXAM V2 validation

on:
  push:
    branches:
      - feature/kost-eexam-v2-native
      - audit/backup-retention-enforcement-2026-09-01
    paths:
      - "platform-ops/kost-eexam-v2/**"
      - "platform-ops/kost-eexam-console-src/**"
      - ".github/workflows/eexam-v2-validation.yml"
  pull_request:
    paths:
      - "platform-ops/kost-eexam-v2/**"
      - "platform-ops/kost-eexam-console-src/**"
      - ".github/workflows/eexam-v2-validation.yml"

permissions:
  contents: read

concurrency:
  group: eexam-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint-type-unit-e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-ops/kost-eexam-v2
    env:
      SESSION_SECRET: ci-only-session-secret-32-characters-minimum
      DB_PATH: ./data/ci-kost-eexam-v2.db
      BACKUP_DIR: ./data/ci-backups
      NODE_ENV: test
      EMAIL_MODE: log
      APP_BASE_URL: http://127.0.0.1:3000
      EMAIL_REPLY_TO: cbta@example.invalid
      EMAIL_DEFAULT_TIMEZONE: Africa/Algiers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm 9.15.9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # Readiness gate: the repository already contains a real Playwright
      # production-build E2E suite, but the validation workflow previously
      # never executed it. Install only Chromium (the configured project)
      # and fail the PR/branch run if the candidate/admin/auditor workflows
      # regress. No production URL or real email delivery is used: the
      # Playwright config starts an isolated local build with EMAIL_MODE=log.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Local backup + restore drill
        run: |
          pnpm migrate
          pnpm backup
          pnpm restore-test

      - name: Production build
        run: pnpm build

  console:
    name: console-token-transport-lint-type-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform-ops/kost-eexam-console-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm 9.15.9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Moodle token transport regression
        run: node --test tests/moodle-request.test.mjs

      # The legacy console was not previously in this workflow and has
      # unrelated repository-wide lint debt. Gate the security-critical files
      # changed here without pretending that older warnings are resolved.
      - name: Focused lint
        run: pnpm exec eslint lib/moodle-client.ts lib/moodle-request.mjs tests/moodle-request.test.mjs

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build
