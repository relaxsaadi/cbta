name: One-shot E-EXAM lifecycle hardening

on:
  push:
    branches:
      - ai/eexam-assessment-lifecycle-serialization-31-61
    paths:
      - .github/workflows/one-shot-eexam-lifecycle-31-61.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/one-shot/apply-eexam-lifecycle-31-61.py')
          s = p.read_text()
          replacements = {
              'reason: "invalid_status" };': 'reason: "invalid_status" as const };',
              'reason: "invalid_schedule", scheduleIssue };': 'reason: "invalid_schedule" as const, scheduleIssue };',
              'reason: "invalid_feedback_configuration" };': 'reason: "invalid_feedback_configuration" as const };',
              'reason: "stale_status" };': 'reason: "stale_status" as const };',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected patch-script anchor: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          python .github/one-shot/apply-eexam-lifecycle-31-61.py
          git diff --check

      - name: Remove one-shot machinery and commit product changes
        run: |
          rm -f .github/one-shot/apply-eexam-lifecycle-31-61.py
          rm -f .github/workflows/one-shot-eexam-lifecycle-31-61.yml
          rmdir .github/one-shot 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no patch produced"; exit 1; }
          git commit -m "E-EXAM: serialize assessment lifecycle with attempt starts (#31 #61)"
          git push origin HEAD:ai/eexam-assessment-lifecycle-serialization-31-61
