name: One-shot E-EXAM reschedule serialization

on:
  push:
    branches:
      - ai/eexam-reschedule-start-serialization-61
    paths:
      - .github/workflows/one-shot-eexam-reschedule-61.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: |
          python .github/one-shot/apply-eexam-reschedule-61.py
          git diff --check

      - name: Remove one-shot machinery and commit product changes
        run: |
          rm -f .github/one-shot/apply-eexam-reschedule-61.py
          rm -f .github/workflows/one-shot-eexam-reschedule-61.yml
          rmdir .github/one-shot 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no patch produced"; exit 1; }
          git commit -m "E-EXAM: serialize reschedule with attempt starts (#61)"
          git push origin HEAD:ai/eexam-reschedule-start-serialization-61
