# Technical compile check for public DGR wording corrections only.
# Passing does NOT certify regulatory facts, confidential exam integrity,
# qualified reviewer sign-off, staging or operational readiness.
name: Public DGR compile gate

on:
  push:
    branches:
      - audit/dgr-main-public-claims-failclosed-20261109
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/public-dgr-compile-gate.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/public-dgr-compile-gate.yml"

permissions:
  contents: read

jobs:
  root-typecheck-build:
    name: Root Next.js TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Production build (non-secret CI placeholders only)
        # Build-time public Supabase configuration is needed by legacy client
        # pages during prerender; these are inert placeholders, NOT deployment
        # credentials or proof of live integration/RBAC/regulatory readiness.
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://supabase-ci.invalid"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "public-ci-build-only-placeholder"
        run: pnpm run build
