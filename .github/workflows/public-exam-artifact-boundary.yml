name: Public exam artifact boundary (paths and keyed Markdown)

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exam-artifact-path-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed repository tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate detector fixture paths
        run: node scripts/check-public-exam-artifact-paths.mjs --self-test
      - name: Reject known answer-key paths and keyed Markdown content from public tree
        run: node scripts/check-public-exam-artifact-paths.mjs
