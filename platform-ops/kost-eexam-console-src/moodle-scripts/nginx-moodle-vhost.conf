server {
    server_name exam.kostacademy.com;

    client_max_body_size 100M;

    location /kost-assets/ {
        alias /var/www/kost-assets/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Workaround for a real Moodle 5.0.1 core bug: get_logo_url() /
    # get_compact_logo_url() (lib/classes/output/renderer_base.php) build a
    # pluginfile URL with only 2 path segments after the filearea
    # (size + revision+filename concatenated), but core_admin_pluginfile()
    # (admin/lib.php) expects 3 separate segments (size + itemid + filename)
    # and does a third array_shift() that comes back empty, so the file
    # lookup always fails with "file not found" — this breaks the site
    # logo, compact logo, and favicon on every Moodle 5.0.1 install that
    # configures a custom logo. Confirmed via direct trace (2026-08-20):
    # the 3-segment form with the revision prefix stripped from the
    # filename (.../logo/0x200/0/kost-logo.png) resolves correctly; the URL
    # Moodle itself renders (.../logo/0x200/1787215073kost-logo.png) does
    # not. Fixed here at the reverse-proxy level (never in Moodle core) by
    # inserting the missing itemid segment and stripping the numeric
    # revision prefix from the filename before forwarding to Moodle.
    location ~ ^/pluginfile\.php/(\d+)/core_admin/(logo|logocompact|favicon)/([0-9]+x[0-9]+)/[0-9]+([a-zA-Z_].*)$ {
        rewrite ^/pluginfile\.php/(\d+)/core_admin/(logo|logocompact|favicon)/([0-9]+x[0-9]+)/[0-9]+([a-zA-Z_].*)$ /pluginfile.php/$1/core_admin/$2/$3/0/$4 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/exam.kostacademy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/exam.kostacademy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = exam.kostacademy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name exam.kostacademy.com;
    return 404; # managed by Certbot


}
